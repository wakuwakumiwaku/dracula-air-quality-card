<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dracula Air Quality Card — Interactive Demo</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      max-width: 100%;
      overflow-x: hidden;
    }
    body {
      min-height: 100vh;
      background: #191a21;
      color: #f8f8f2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      padding: 16px 22px 24px;
    }
    .page-header {
      max-width: 1280px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }
    .brand-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(189, 147, 249, 0.25), rgba(139, 233, 253, 0.2));
      border: 1px solid rgba(189, 147, 249, 0.45);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #bd93f9;
      flex-shrink: 0;
    }
    .brand-badge svg {
      width: 19px;
      height: 19px;
    }
    .brand-text {
      min-width: 0;
    }
    .brand h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #f8f8f2;
    }
    .brand p {
      margin: 2px 0 0;
      font-size: 12px;
      color: #b8c0e0;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #21222c;
      border: 1px solid rgba(98, 114, 164, 0.35);
      font-size: 11.5px;
      color: #b8c0e0;
      font-variant-numeric: tabular-nums;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #50fa7b;
      box-shadow: 0 0 8px rgba(80, 250, 123, 0.55);
      flex-shrink: 0;
    }
    .showcase-grid {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(440px, 1.25fr) 352px 352px;
      gap: 18px;
      align-items: start;
    }
    .col {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }
    .col-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6272a4;
    }
    .col-label .primary-title {
      color: #f8f8f2;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .col-label .std-badge {
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(189, 147, 249, 0.2);
      border: 1px solid rgba(189, 147, 249, 0.5);
      color: #bd93f9;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.06em;
    }
    .col-label span.tag {
      color: #bd93f9;
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    .col-label span.tag.muted {
      color: #8be9fd;
    }
    @media (max-width: 1180px) {
      .showcase-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .col.col-overview {
        grid-column: 1 / -1;
      }
    }
    @media (max-width: 720px) {
      body {
        padding: 12px 12px 20px;
      }
      .page-header {
        margin-bottom: 12px;
      }
      .brand h1 {
        font-size: 15.5px;
      }
      .brand p {
        font-size: 11.5px;
      }
      .showcase-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 14px;
      }
    }
  </style>
</head>

    function syncCadr(slug, pct, isOn) {
      const cadrId = `sensor.${slug}_cadr`;
      if (!states[cadrId]) return;
      const maxCadr = baseCadr[slug] || 240;
      const next = isOn ? Math.max(35, Math.round((maxCadr * (pct || 25)) / 100)) : 0;
      states[cadrId] = { ...states[cadrId], state: String(next) };
    }

    const cards = [];

    function pushHass() {
      const nextHass = {
        states: { ...states },
        callService,
      };
      for (const card of cards) {
        card.hass = nextHass;
      }
    }

    function callService(domain, service, data = {}) {
      const id = data.entity_id;
      const ent = id ? states[id] : null;
      if (!ent) return;

      const slug = id.split(".")[1];

      if (domain === "fan") {
        if (service === "turn_on") {
          const pct = ent.attributes.percentage > 0 ? ent.attributes.percentage : 50;
          states[id] = {
            ...ent,
            state: "on",
            attributes: { ...ent.attributes, percentage: pct },
          };
          syncCadr(slug, pct, true);
          logActivity(`Turned on ${ent.attributes.friendly_name || slug}`);
        } else if (service === "turn_off") {
          states[id] = { ...ent, state: "off" };
          syncCadr(slug, 0, false);
          logActivity(`Turned off ${ent.attributes.friendly_name || slug}`);
        } else if (service === "set_percentage") {
          const pct = Number(data.percentage) || 0;
          const isOn = pct > 0;
          states[id] = {
            ...ent,
            state: isOn ? "on" : "off",
            attributes: { ...ent.attributes, percentage: pct },
          };
          const modeSelectId = `select.${slug}_fan_mode`;
          if (isOn && states[modeSelectId]?.attributes?.options?.includes("Manual")) {
            states[modeSelectId] = { ...states[modeSelectId], state: "Manual" };
          }
          syncCadr(slug, pct, isOn);
          logActivity(`Set ${ent.attributes.friendly_name || slug} speed → ${pct}%`);
        } else if (service === "set_preset_mode") {
          const mode = String(data.preset_mode);
          const pct = mode.toLowerCase().includes("sleep")
            ? 25
            : mode.toLowerCase().includes("turbo") || mode.toLowerCase().includes("pet")
            ? 100
            : 50;
          states[id] = {
            ...ent,
            state: "on",
            attributes: { ...ent.attributes, preset_mode: mode, percentage: pct },
          };
          syncCadr(slug, pct, true);
          logActivity(`Set ${ent.attributes.friendly_name || slug} mode → ${mode}`);
        }
      } else if (domain === "select" && service === "select_option") {
        states[id] = { ...ent, state: String(data.option) };
        if (slug.endsWith("_fan_mode")) {
          const fanSlug = slug.replace(/_fan_mode$/, "");
          const fanId = `fan.${fanSlug}`;
          if (states[fanId]) {
            const optLower = String(data.option).toLowerCase();
            const pct = optLower.includes("sleep")
              ? 25
              : optLower.includes("pet")
              ? 100
              : optLower.includes("auto")
              ? 50
              : states[fanId].attributes.percentage || 50;
            states[fanId] = {
              ...states[fanId],
              state: "on",
              attributes: { ...states[fanId].attributes, percentage: pct, preset_mode: optLower },
            };
            syncCadr(fanSlug, pct, true);
          }
        }
        logActivity(`Selected ${data.option} on ${ent.attributes.friendly_name || slug}`);
      } else if (domain === "switch" || domain === "light") {
        const nextState = service === "turn_on" ? "on" : "off";
        states[id] = { ...ent, state: nextState };
        logActivity(`${ent.attributes.friendly_name || slug} → ${nextState.toUpperCase()}`);
      } else if (domain === "lock") {
        const nextState = service === "lock" ? "locked" : "unlocked";
        states[id] = { ...ent, state: nextState };
        logActivity(`${ent.attributes.friendly_name || slug} → ${nextState}`);
      } else if ((domain === "number" || domain === "input_number") && service === "set_value") {
        const val = String(data.value);
        states[id] = { ...ent, state: val };
        const remId = `sensor.${slug}_remaining`;
        if (states[remId]) {
          states[remId] = { ...states[remId], state: val };
        }
        logActivity(`Timer → ${Number(val) > 0 ? `${val} min` : "Off"}`);
      }

      pushHass();
    }

    /* --- Mount Card 1: Purifier Mode --- */
    const purifierCard = document.createElement("dracula-air-quality-card");
    purifierCard.setConfig({
      entity: "fan.bedroom_levoit_core_300s",
      name: "Bedroom Core 300S",
      theme: "dracula",
      show_cadr: true,
      show_filter: true,
      show_timer: true,
    });
    document.getElementById("slot-purifier").appendChild(purifierCard);
    cards.push(purifierCard);

    /* --- Mount Card 2: Standalone AQ Sensor Mode (CO, CO2, VOC, tVOC, PM2.5, PM10, Temp, Humidity) --- */
    const sensorCard = document.createElement("dracula-air-quality-card");
    sensorCard.setConfig({
      mode: "sensor",
      name: "Office Air Monitor",
      theme: "dracula",
      sensors: {
        pm25: "sensor.office_air_pm25",
        pm10: "sensor.office_air_pm10",
        co: "sensor.office_air_co",
        co2: "sensor.office_air_co2",
        voc: "sensor.office_air_voc",
        tvoc: "sensor.office_air_tvoc",
        temperature: "sensor.office_air_temperature",
        humidity: "sensor.office_air_humidity",
      },
    });
    document.getElementById("slot-sensor").appendChild(sensorCard);
    cards.push(sensorCard);

    /* --- Mount Card 3: Whole-Home Overview Mode (Grouped by type: 5 Purifiers + 3 AQ Sensors) --- */
    const overviewCard = document.createElement("dracula-air-quality-card");
    overviewCard.setConfig({
      name: "Whole-Home Air Quality",
      theme: "dracula",
      group_by: "type",
      devices: [
        { entity: "fan.bedroom_levoit_core_300s", name: "Bedroom · Core 300S", room: "Upstairs" },
        { entity: "fan.living_room_levoit_core_400s", name: "Living Room · Core 400S", room: "Main Floor" },
        { entity: "fan.kitchen_levoit_vital_200s", name: "Kitchen · Vital 200S", room: "Main Floor" },
        { entity: "fan.master_xiaomi_4_pro", name: "Master · Xiaomi 4 Pro", room: "Upstairs" },
        { entity: "fan.nursery_ikea_starkvind", name: "Nursery · IKEA Starkvind", room: "Upstairs" },
        {
          name: "Office Air Monitor",
          room: "Main Floor",
          sensors: {
            pm25: "sensor.office_air_pm25",
            pm10: "sensor.office_air_pm10",
            co: "sensor.office_air_co",
            co2: "sensor.office_air_co2",
            voc: "sensor.office_air_voc",
            tvoc: "sensor.office_air_tvoc",
            temperature: "sensor.office_air_temperature",
            humidity: "sensor.office_air_humidity",
          },
        },
        {
          name: "Basement CO/CO₂/VOC",
          room: "Basement",
          sensors: {
            pm25: "sensor.basement_air_pm25",
            co: "sensor.basement_air_co",
            co2: "sensor.basement_air_co2",
            voc: "sensor.basement_air_voc",
            hcho: "sensor.basement_air_hcho",
            radon: "sensor.basement_air_radon",
            temperature: "sensor.basement_air_temperature",
            humidity: "sensor.basement_air_humidity",
          },
        },
        {
          name: "Garage CO Detector",
          room: "Garage",
          sensors: {
            co: "sensor.garage_co",
            co_alarm: "binary_sensor.garage_co_alarm",
            temperature: "sensor.garage_temperature",
            humidity: "sensor.garage_humidity",
          },
        },
      ],
    });
    document.getElementById("slot-overview").appendChild(overviewCard);
    cards.push(overviewCard);

    /* Listen for hass-more-info events from any card */
    document.addEventListener("hass-more-info", (e) => {
      const entityId = e.detail?.entityId;
      if (entityId) {
        logActivity(`More-info dialog: ${entityId}`);
      }
    });

    pushHass();
  </script>
</body>
</html>
